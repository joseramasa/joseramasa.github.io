  label: VP of Innovation · Hardware Security & Entropy Infrastructure
  email: jrmsaavedra@gmail.com
  location: Barcelona, Spain
  image: ""
  summary: VP of Innovation building verifiable entropy infrastructure for cybersecurity and accelerated computing, from photonic entropy sources and FPGA/silicon implementations to drivers, SDKs and certification. PI of €7.5M+ in competitive R&D funding; co-inventor of 8 patent families; responsible for a 30+ family IP portfolio at Quside Technologies.

