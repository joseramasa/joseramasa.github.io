      - company: Quside Technologies S.L.
        position: VP of Innovation (since 2023) · Lead Scientist (since 2018)
        location: Barcelona, Spain
        start_date: 2018
        end_date:
        summary: R&D, IP and funding leadership for verifiable entropy in cybersecurity and accelerated computing.
        highlights:
          - "Lead a team of ~10 and set technical direction across engineering (25–50 people)"
          - "Lead R&D across the entropy stack: photonic entropy sources and chips, FPGA and silicon implementations, PCIe/USB devices, drivers (Linux, Windows, FreeBSD) and SDKs"
          - "Brought verifiable entropy to GPU computing with quside-curand, a cuRAND-style API for NVIDIA CUDA workflows (2026)"
          - "Drive certification and security integration: NIST SP 800-90B-compliant entropy sources, BSI AIS 20/31 evaluation in progress, and integration with post-quantum cryptography"
          - "Industrial partnerships, e.g. a scalable VCSEL-based entropy source demonstrated with Coherent (2026)"
          - "IP strategy: 30+ patent families under management; co-inventor in 8 (US, EP, CN, JP)"
          - "PI for Quside in GUARDIANE-Q (CDTI Misiones, 2026–2029) and QUARTERNEXT (Digital Europe, 2026–2030); PI of RPU (Horizon Europe EIC, €3.9M) and PICNET (CDTI, €1.75M)"

