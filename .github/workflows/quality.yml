name: Quality gates

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Build site
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 1

  html-proofer:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Check internal links and HTML
        run: |
          gem install html-proofer
          htmlproofer _site \
            --disable-external \
            --allow-hash-href \
            --allow-missing-href \
            --no-enforce-https \
            --swap-urls "^https?\://joseramasa\.github\.io:" \
            --ignore-urls "/fonts.googleapis.com/,/cdnjs.cloudflare.com/,/cdn.jsdelivr.net/,/fotonica/,/con-la-venia/,/news/,/blog\/tag\//" \
            --checks Links,Scripts

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          configPath: .github/lighthouse/lighthouserc.json
